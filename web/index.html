<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地 RAG 知识库问答</title>

<!--
  说明：这是一个零构建的静态页面，由 FastAPI 的 StaticFiles 直接托管。
  选它的理由是"最快跑通完整链路"——不需要 node_modules、不需要打包配置，
  打开 http://127.0.0.1:8000/ 即可用。RAG 的核心价值在检索与生成，
  前端框架与之正交，因此先用最轻的方式验证端到端流程。

  marked.js 用于渲染 Markdown。它是唯一的外部依赖，且做了离线降级：
  若 CDN 不可达，会退化为纯文本显示，功能不受影响。
-->
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

<style>
  /* ==================== 设计变量 ==================== */
  :root {
    --bg:            #0f1117;   /* 页面底色 */
    --bg-elevated:   #171a23;   /* 卡片/边栏 */
    --bg-input:      #1e222d;
    --border:        #272b38;
    --text:          #e6e8ee;
    --text-dim:      #9aa1b1;
    --text-faint:    #6b7285;
    --accent:        #5b8dff;   /* 主色：用于用户气泡与强调 */
    --accent-soft:   #1c2740;
    --success:       #3ecf8e;
    --warn:          #e8b339;
    --danger:        #f0616d;
    --radius:        10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 14px; line-height: 1.65;
  }

  /* ==================== 布局 ==================== */
  /* 100dvh 作为 100vh 的补充：移动端浏览器地址栏伸缩会让 100vh 溢出，
     导致底部输入框被裁掉。不支持的浏览器会忽略第二行、沿用 100vh。 */
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .sub { color: var(--text-faint); font-size: 12px; }

  /* 状态指示点：绿=就绪，黄=降级，红=不可用 */
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-faint); flex-shrink: 0;
  }
  .status-dot.ok       { background: var(--success); }
  .status-dot.degraded { background: var(--warn); }
  .status-dot.down     { background: var(--danger); }

  /* 顶部能力标签：直观展示混合检索的技术栈正在生效 */
  .tags { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .tag {
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: var(--bg-input); color: var(--text-dim);
    border: 1px solid var(--border); white-space: nowrap;
  }
  .tag.on  { color: var(--success); border-color: #23503c; background: #14251d; }

  /* 降级告警条：把 /health 的 warnings 显示出来。
     之所以必须有它：重排模型加载失败会被优雅降级为"不重排"，
     此前原因只写在浏览器控制台，界面上只看到一个"重排已关闭"标签，
     完全不知道发生了什么 —— 这会让人误以为是配置问题而反复改配置。 */
  .banner {
    flex-shrink: 0;
    padding: 10px 20px;
    background: #2a2216;
    border-bottom: 1px solid #5c4a20;
    color: #f0d190;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .banner strong { color: #ffd98a; }
  .banner ul { margin: 4px 0 0; padding-left: 20px; }
  .banner li { margin: 2px 0; }

  main { flex: 1; overflow-y: auto; padding: 20px; }
  .thread { max-width: 820px; margin: 0 auto; }

  /* ==================== 消息 ==================== */
  .msg { margin-bottom: 20px; display: flex; flex-direction: column; }
  .msg .role {
    font-size: 11px; color: var(--text-faint);
    margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em;
  }
  .bubble {
    padding: 12px 16px; border-radius: var(--radius);
    background: var(--bg-elevated); border: 1px solid var(--border);
    overflow-wrap: break-word;
  }
  .msg.user { align-items: flex-end; }
  .msg.user .bubble {
    background: var(--accent-soft);
    border-color: #2b3f66;
    max-width: 85%;
  }

  /* Markdown 内容样式 */
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child  { margin-bottom: 0; }
  .bubble code {
    font-family: var(--mono); font-size: 12.5px;
    background: #0b0d13; padding: 1px 5px; border-radius: 4px;
  }
  .bubble pre {
    background: #0b0d13; border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; overflow-x: auto;
  }
  .bubble pre code { background: none; padding: 0; }
  .bubble ul, .bubble ol { padding-left: 22px; }
  .bubble a { color: var(--accent); }

  /* 光标：生成过程中显示，让"正在输出"有明确视觉反馈 */
  .cursor {
    display: inline-block; width: 7px; height: 15px;
    background: var(--accent); vertical-align: text-bottom;
    animation: blink 1s step-end infinite; margin-left: 2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ==================== 引用卡片 ==================== */
  .sources { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .sources-title {
    font-size: 11px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .source {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px;
    cursor: pointer; transition: border-color .15s;
  }
  .source:hover { border-color: #3a4256; }
  .source .src-head {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-dim); margin-bottom: 4px; flex-wrap: wrap;
  }
  .source .src-idx {
    font-family: var(--mono); color: var(--accent); font-weight: 600;
  }
  .source .src-name { color: var(--text); }
  .source .src-meta { font-size: 11px; color: var(--text-faint); }
  .source .src-snippet { color: var(--text-dim); line-height: 1.5; }
  /* 展开态用正常的自动折行，**不要**用 pre-wrap：
     PDF 抽出来的文本每十几个字就带一个硬换行（对应原 PDF 的视觉行宽），
     保留这些换行会让展开后只有左侧窄窄一列有字、右侧全空。
     用 normal 让浏览器按容器宽度重新折行，读起来才正常。 */
  .source .src-full {
    display: none;
    margin-top: 6px;
    white-space: normal;
    overflow-wrap: anywhere;   /* 超长英文单词/URL 也能断行，避免撑破卡片 */
    line-height: 1.65;
  }
  .source.expanded .src-full { display: block; }
  .source.expanded .src-snippet { display: none; }
  /* 展开时给卡片一点视觉区分，便于看出当前展开的是哪一条 */
  .source.expanded { border-color: #3a4256; background: #1b1f29; }

  /* 打分徽章：用颜色区分"双分支命中"与"单分支命中" */
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 4px;
    font-family: var(--mono);
  }
  .badge.hybrid { background: #1b3a2c; color: var(--success); }
  .badge.dense  { background: #20293f; color: #7ba0ff; }
  .badge.sparse { background: #3a3120; color: var(--warn); }
  /* 服务端融合下拿不到分支名次，用中性徽章，避免被误标成"语义命中" */
  .badge.fused  { background: #262a35; color: var(--text-dim); }

  /* "回到最新"悬浮按钮：用户往上翻看历史内容时出现。
     没有它的话，流式输出期间用户滚上去就看不懂"为什么又跳回底部了"。 */
  .jump-bottom {
    position: fixed;
    right: 28px;
    bottom: 104px;                 /* 悬在输入框上方，不挡住 composer */
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid #35405a;
    background: var(--bg-elevated);
    color: var(--text);
    font-size: 12.5px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .35);
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
    z-index: 20;
  }
  .jump-bottom.show { opacity: 1; pointer-events: auto; }

  /* ==================== 输入区 ==================== */
  footer {
    flex-shrink: 0; border-top: 1px solid var(--border);
    background: var(--bg-elevated); padding: 12px 20px;
  }
  .composer { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px;
    padding: 11px 14px; border-radius: var(--radius);
    background: var(--bg-input); color: var(--text);
    border: 1px solid var(--border); font-family: inherit; font-size: 14px;
    line-height: 1.5; outline: none;
  }
  textarea:focus { border-color: #35405a; }
  button {
    padding: 0 18px; height: 44px; border-radius: var(--radius);
    border: none; background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: opacity .15s; white-space: nowrap;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .hint { max-width: 820px; margin: 8px auto 0; font-size: 11px; color: var(--text-faint); }

  .error {
    background: #2a1620; border: 1px solid #5c2733; color: #ffb3bb;
    padding: 10px 14px; border-radius: 8px; font-size: 13px;
  }

  /* 可访问性：尊重系统的"减少动画"偏好 */
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <span class="status-dot" id="statusDot"></span>
    <div>
      <h1>本地 RAG 知识库问答</h1>
      <div class="sub" id="statusText">正在连接服务…</div>
    </div>
    <!-- 技术栈标签：由 /health 的真实返回值填充，不是写死的装饰 -->
    <div class="tags" id="tags"></div>
  </header>

  <!-- 降级原因由 /health 的 warnings 驱动，首屏刷新时填充 -->
  <div class="banner" id="banner" hidden></div>

  <main id="main">
    <div class="thread" id="thread">
      <div class="msg">
        <div class="role">系统</div>
        <div class="bubble">
          <p>已就绪。提问后系统会执行：<strong>查询向量化</strong> →
          <strong>稠密检索 + BM25 词法检索</strong> → <strong>RRF 融合</strong> →
          <strong>交叉编码器重排</strong> → <strong>流式生成</strong>。</p>
          <p>回答下方的引用卡片可以点击展开，查看该分块的完整内容与排序依据。</p>
        </div>
      </div>
    </div>
  </main>

  <button class="jump-bottom" id="jumpBottom" type="button">↓ 回到最新</button>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1"
        placeholder="输入问题，Enter 发送，Shift+Enter 换行…"></textarea>
      <button id="send">发送</button>
    </div>
  </footer>

</div>

<script>
"use strict";

/* ==========================================================================
   全局状态
   ========================================================================== */
const state = {
  busy: false,        // 是否正在生成，用于防重复提交
  answerText: "",     // 已累积的答案文本
};

const $ = (id) => document.getElementById(id);

/* ==========================================================================
   工具函数
   ========================================================================== */

/**
 * 渲染 Markdown。marked 不可用（离线环境）时降级为转义后的纯文本。
 *
 * 安全注意：结果会被塞进 innerHTML，而内容来自模型输出（可能包含文档里的原文）。
 * 所以**先转义 HTML 再交给 marked** —— 否则文档里若带 `<img onerror=...>`，
 * 就会被当成标签执行。我们不需要 Markdown 里的原始 HTML，转义没有功能损失。
 */
function renderMarkdown(text) {
  const safe = escapeHtml(text);

  if (window.marked && typeof window.marked.parse === "function") {
    try {
      const html = window.marked.parse(safe, { breaks: true });
      // 兜底：Markdown 的链接语法仍能造出 javascript: 协议，直接中和掉
      return html.replace(/href="\s*javascript:[^"]*"/gi, 'href="#"');
    } catch (e) {
      console.warn("Markdown 渲染失败，降级为纯文本", e);
    }
  }
  return safe.replace(/\n/g, "<br>");
}

/** HTML 转义。用户输入要插进 innerHTML 时必经此函数，防止 XSS。 */
function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/* ==========================================================================
   自动滚动：贴底跟随
   ========================================================================== */

// 流式输出期间若每帧都无条件 `scrollTop = scrollHeight`，用户根本没法往上翻 ——
// 一滚就被拽回底部。所以只在"用户本来就在底部"时跟随。
//
// 三个关键细节（也是之前偶发"被锁在底部"的真正原因）：
//   1. `scroll` 事件是**异步派发**的。等它到达时，我们排的渲染 rAF 可能已经先跑，
//      按尚未更新的 stickToBottom 把页面拉回了底部。所以不能只靠 scroll 判断，
//      必须同时监听 wheel / touchmove / keydown 这些**同步**的用户意图信号。
//   2. 阈值必须小。用大阈值（比如 80px）时，用户往上滚一点点仍被算作"在底部"，
//      下一个 token 就把他拽回去 —— 手感就是"不跟手、偶尔被锁住"。
//   3. rAF 里要**再判一次**：这一帧内用户可能已经上滚了。

const STICK_EPSILON = 8;        // 距底多少像素内算"贴底"
const mainEl = $("main");
const jumpBtn = $("jumpBottom");

let stickToBottom = true;

/** 当前是否停在底部附近。 */
function isNearBottom() {
  return mainEl.scrollHeight - mainEl.scrollTop - mainEl.clientHeight <= STICK_EPSILON;
}

/** 同步"回到最新"按钮的显隐。 */
function syncJumpButton() {
  jumpBtn.classList.toggle("show", !stickToBottom);
}

/** 用户表达了"要往上翻"的意图 —— 立刻停止跟随（同步生效，赶在 rAF 之前）。 */
function stopFollowing() {
  if (!stickToBottom) return;
  stickToBottom = false;
  syncJumpButton();
}

/**
 * 滚动到底部，受贴底状态约束。
 *
 * @param {boolean} force 为 true 时无视贴底状态强制滚动 ——
 *   发新消息、出现错误这类"必须让用户看到"的场景用它。
 */
function scrollToBottom(force = false) {
  if (!force && !stickToBottom) return;
  requestAnimationFrame(() => {
    // 二次确认：这一帧内用户可能已经上滚，此时不该再把他拉回来
    if (!force && !stickToBottom) return;
    mainEl.scrollTop = mainEl.scrollHeight;
    stickToBottom = true;
    syncJumpButton();
  });
}

// ---- 同步的用户意图信号（早于 scroll 事件与 rAF）----
// 滚轮向上 / 双指上滑
mainEl.addEventListener("wheel", (e) => {
  if (e.deltaY < 0) stopFollowing();
}, { passive: true });

// 触摸：手指往下拖 ⇒ 内容往上滚 ⇒ 用户想看更早的内容
let touchStartY = 0;
mainEl.addEventListener("touchstart", (e) => {
  touchStartY = e.touches[0] ? e.touches[0].clientY : 0;
}, { passive: true });
mainEl.addEventListener("touchmove", (e) => {
  const y = e.touches[0] ? e.touches[0].clientY : touchStartY;
  if (y - touchStartY > 8) stopFollowing();
}, { passive: true });

// 键盘：翻页键/上键
mainEl.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp" || e.key === "PageUp" || e.key === "Home") stopFollowing();
});

// ---- scroll 事件作为兜底 ----
// 覆盖"拖滚动条"这类没有 wheel/touch 信号的操作，以及"滚回底部恢复跟随"。
mainEl.addEventListener("scroll", () => {
  const near = isNearBottom();
  if (near !== stickToBottom) {
    stickToBottom = near;
    syncJumpButton();
  }
});

jumpBtn.addEventListener("click", () => {
  scrollToBottom(true);
  input.focus();
});

/* ==========================================================================
   服务状态探测
   ========================================================================== */

/**
 * 拉取 /health 并渲染状态标签。
 * 这里展示 bm25_mode / fusion_mode / rerank 的**真实**取值，
 * 而不是写死文案——降级发生时界面上能直接看出来。
 */
async function refreshHealth() {
  const dot = $("statusDot");
  const text = $("statusText");
  const tags = $("tags");

  try {
    const res = await fetch("/health");
    const h = await res.json();

    if (h.ready) {
      dot.className = "status-dot ok";
      text.textContent =
        `Milvus ${h.milvus.server_version} · 知识库 ${h.milvus.chunks} 个分块`;
    } else {
      dot.className = "status-dot down";
      text.textContent = h.error || "服务未就绪";
    }

    // 用真实配置渲染能力标签
    // 注意 reranker 字段做存在性判断：后端异常时这些字段可能是 undefined，
    // 直接取属性会抛错，导致整个状态渲染失败、界面只剩一个"重排已关闭"。
    const rr = h.reranker || {};
    const rrEnabled = rr.enabled === true;
    const rrName = String(rr.model || "reranker").split("/").pop();
    const rrLabel = rrEnabled
      ? (rr.loaded_offline === true ? `重排 ${rrName}（本地缓存）` : `重排 ${rrName}`)
      : "重排未启用";

    const items = [
      { label: "稠密检索", on: true },
      { label: "BM25 词法检索", on: true },
      { label: `RRF k=${h.retrieval.rrf_k}`, on: true },
      { label: rrLabel, on: rrEnabled },
      { label: h.llm.chat_model, on: true },
    ];
    tags.innerHTML = items
      .map((i) => `<span class="tag${i.on ? " on" : ""}">${escapeHtml(i.label)}</span>`)
      .join("");

    // ---- 降级告警条：把原因显示在页面上，而不是只丢进控制台 ----
    const banner = $("banner");
    const problems = [];
    if (h.error) problems.push(h.error);
    (h.warnings || []).forEach((w) => problems.push(w));

    if (problems.length) {
      banner.innerHTML =
        "<strong>服务已降级 —— 功能可用，但检索效果可能下降：</strong>" +
        `<ul>${problems.map((p) => `<li>${escapeHtml(p)}</li>`).join("")}</ul>`;
      banner.hidden = false;
      // 同时保留控制台输出，便于复制完整信息去查日志
      console.warn("服务降级：", problems);
    } else {
      banner.hidden = true;
      banner.innerHTML = "";
    }
  } catch (err) {
    dot.className = "status-dot down";
    text.textContent = "无法连接服务：" + err.message;
  }
}

/* ==========================================================================
   消息渲染
   ========================================================================== */

function addUserMessage(text) {
  const el = document.createElement("div");
  el.className = "msg user";
  el.innerHTML = `<div class="role">你</div>
                  <div class="bubble">${escapeHtml(text)}</div>`;
  $("thread").appendChild(el);
  scrollToBottom(true);
  return el;
}

/** 创建空的助手气泡，返回其中用于写入正文的元素。 */
function addAssistantMessage() {
  const el = document.createElement("div");
  el.className = "msg assistant";
  el.innerHTML = `<div class="role">助手</div>
                  <div class="bubble"><span class="answer"></span><span class="cursor"></span></div>
                  <div class="sources"></div>`;
  $("thread").appendChild(el);
  scrollToBottom(true);
  return el.querySelector(".answer");
}

/** 结束生成：移除闪烁光标。 */
function finishAssistantMessage(el) {
  const cursor = el.parentElement.querySelector(".cursor");
  if (cursor) cursor.remove();
}

function showError(message) {
  const el = document.createElement("div");
  el.className = "msg";
  el.innerHTML = `<div class="role">错误</div>
                  <div class="bubble"><div class="error">${escapeHtml(message)}</div></div>`;
  $("thread").appendChild(el);
  scrollToBottom(true);
}

/**
 * 渲染引用卡片。
 * 分数与命中分支都展示出来，让"为什么这条被选中"可被检验——
 * 这是检索系统可解释性的最小实现。
 */
function renderSources(container, sources) {
  if (!sources || !sources.length) {
    container.innerHTML = `<div class="sources-title">未检索到相关内容</div>`;
    return;
  }

  const head = `<div class="sources-title">检索到 ${sources.length} 条上下文</div>`;

  const cards = sources.map((s, i) => {
    // 命中分支决定徽章：
    //   双分支命中 = 语义与关键词都命中（最强信号）
    //   仅稀疏命中 = 关键词命中
    //   仅稠密命中 = 语义命中
    const hasDenseRank = s.dense_rank !== null && s.dense_rank !== undefined;
    const hasSparseRank = s.sparse_rank !== null && s.sparse_rank !== undefined;

    let badgeClass = "fused", badgeText = "未知来源";
    if (s.is_hybrid_hit) {
      badgeClass = "hybrid"; badgeText = "双分支命中";
    } else if (hasSparseRank) {
      badgeClass = "sparse"; badgeText = "关键词命中";
    } else if (hasDenseRank) {
      badgeClass = "dense"; badgeText = "语义命中";
    }

    // 分数：后端只给一个 score + score_kind 标明它是哪种分。
    // 两者有效位数差别很大 —— RRF 分约 0.016，重排分在 0~1 之间。
    const scoreText = (s.score !== null && s.score !== undefined)
      ? (s.score_kind === "rerank"
          ? `重排 ${Number(s.score).toFixed(3)}`
          : `RRF ${Number(s.score).toFixed(5)}`)
      : "";

    const rankParts = [];
    if (hasDenseRank) rankParts.push(`稠密#${s.dense_rank + 1}`);
    if (hasSparseRank) rankParts.push(`稀疏#${s.sparse_rank + 1}`);

    return `
      <div class="source" data-idx="${i}">
        <div class="src-head">
          <span class="src-idx">[${i + 1}]</span>
          <span class="src-name">${escapeHtml(s.source || "未知来源")}</span>
          <span class="src-meta">第 ${(s.chunk_index ?? 0) + 1} 块</span>
          <span class="badge ${badgeClass}">${badgeText}</span>
          ${scoreText ? `<span class="src-meta">${escapeHtml(scoreText)}</span>` : ""}
          ${rankParts.length ? `<span class="src-meta">${escapeHtml(rankParts.join(" · "))}</span>` : ""}
        </div>
        <div class="src-snippet">${escapeHtml(s.snippet || "")}</div>
        <div class="src-full">${escapeHtml(s.text || s.snippet || "")}</div>
      </div>`;
  }).join("");

  container.innerHTML = head + `<div class="sources">${cards}</div>`;

  // 点击卡片展开/收起完整片段
  container.querySelectorAll(".source").forEach((node) => {
    node.addEventListener("click", () => node.classList.toggle("expanded"));
  });
}

/* ==========================================================================
   SSE 解析与流式消费
   ========================================================================== */

/**
 * 解析单个 SSE 帧。
 * 帧格式：若干 "字段: 值" 行，字段有 event / data / id / retry。
 * 本项目只用 event 与 data。
 */
function parseFrame(raw) {
  let event = "message";
  const dataLines = [];

  for (const line of raw.split("\n")) {
    if (!line || line.startsWith(":")) continue;   // 空行与注释行(心跳)跳过
    const idx = line.indexOf(":");
    if (idx === -1) continue;
    const field = line.slice(0, idx).trim();
    // 规范要求：冒号后若有一个空格应被去掉
    let value = line.slice(idx + 1);
    if (value.startsWith(" ")) value = value.slice(1);

    if (field === "event") event = value.trim();
    else if (field === "data") dataLines.push(value);
  }

  if (!dataLines.length) return null;

  let data = null;
  try {
    data = JSON.parse(dataLines.join("\n"));
  } catch (e) {
    console.warn("SSE data 不是合法 JSON，已忽略", dataLines, e);
    return null;
  }
  return { event, data };
}

/**
 * 发送问题并消费 SSE 流。
 *
 * 为什么用 fetch + ReadableStream 而不是 EventSource：
 *   EventSource 只支持 GET 且不能自定义请求头，问题文本只能塞进 URL，
 *   长文本会被 URL 长度限制截断、也会把用户问题写进服务器访问日志。
 *   fetch 支持 POST + JSON body，配合 ReadableStream 手动解析 SSE，
 *   是当前浏览器端的标准做法。
 */
async function ask(question) {
  state.busy = true;
  $("send").disabled = true;

  addUserMessage(question);
  const answerEl = addAssistantMessage();
  const msgRoot = answerEl.closest(".msg");
  const sourcesEl = msgRoot.querySelector(".sources");

  // 用于累积答案，最后统一渲染 Markdown——
  // 逐 token 重新解析 Markdown 会造成打字时的格式闪烁（例如 ** 刚出现时）
  state.answerText = "";

  let rafPending = false;

  /** 合并高频更新：token 到达速度可能远高于屏幕刷新率。 */
  const scheduleRender = () => {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      rafPending = false;
      answerEl.textContent = state.answerText;
      // 在**同一帧**内完成滚动：之前是再排一个 rAF 去滚，
      // 多滞后一帧，手感上就是"跟不上"。
      if (stickToBottom) mainEl.scrollTop = mainEl.scrollHeight;
    });
  };

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: question, include_sources: true }),
    });

    // 非 200 时后端返回的是普通 JSON（如 503 未就绪），单独处理
    if (!res.ok) {
      let detail = `HTTP ${res.status}`;
      try {
        const errBody = await res.json();
        detail = errBody.detail || detail;
      } catch (_) { /* 响应体不是 JSON，保留状态码 */ }
      finishAssistantMessage(answerEl);
      showError(detail);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      // stream:true 让多字节 UTF-8 字符能跨 chunk 正确拼接，
      // 否则中文会被切成乱码（这是流式解码最常见的坑）
      buffer += decoder.decode(value, { stream: true });

      // 帧以空行分隔；最后一段可能不完整，留在 buffer 里等下次
      const frames = buffer.split("\n\n");
      buffer = frames.pop();

      for (const raw of frames) {
        const parsed = parseFrame(raw);
        if (!parsed) continue;
        const { event, data } = parsed;

        if (event === "sources") {
          renderSources(sourcesEl, data.sources);
          // 引用卡片会撑高内容；贴底时要跟上，否则用户看着"卡"在半路
          if (stickToBottom) scrollToBottom();
        } else if (event === "token") {
          state.answerText += data.text || "";
          scheduleRender();
        } else if (event === "done") {
          finishAssistantMessage(answerEl);
        } else if (event === "error") {
          finishAssistantMessage(answerEl);
          showError(data.message || "服务端处理失败");
        }
      }
    }

    // 收尾：把累积文本渲染成 Markdown。
    // 这一步会改变高度（列表、代码块、标题间距），所以贴底时要重新对齐一次。
    await new Promise((r) => requestAnimationFrame(r));
    answerEl.innerHTML = renderMarkdown(state.answerText);
    finishAssistantMessage(answerEl);
    if (stickToBottom) scrollToBottom();

  } catch (err) {
    finishAssistantMessage(answerEl);
    showError("请求失败：" + err.message);
  } finally {
    state.busy = false;
    $("send").disabled = false;
    $("input").focus();
  }
}

/* ==========================================================================
   事件绑定
   ========================================================================== */

const input = $("input");

/** 自适应高度：让输入框随内容增长，但不超过 CSS 里的 max-height。 */
function autoGrow() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 160) + "px";
}

function submit() {
  const text = input.value.trim();
  if (!text || state.busy) return;   // 生成中忽略重复提交
  input.value = "";
  autoGrow();
  ask(text);
}

input.addEventListener("input", autoGrow);
input.addEventListener("keydown", (e) => {
  // Enter 发送，Shift+Enter 换行（聊天界面的通用约定）
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    submit();
  }
});
$("send").addEventListener("click", submit);

// 滚动跟随的监听器注册在"自动滚动"那一节（与滚动逻辑放在一起，避免两处各绑一半）

// 启动时探测服务状态
refreshHealth();
// 定期刷新，便于入库后看到分块数变化
setInterval(refreshHealth, 30000);
input.focus();
</script>
</body>
