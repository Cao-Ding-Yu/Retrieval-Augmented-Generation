[build-system]
# 采用 setuptools + src layout：包位于 src/ 下，避免测试时误导入工作区根目录
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RAG-app"
version = "0.1.0"
description = "本地 RAG 系统：Milvus 混合检索(BM25+稠密) + RRF 融合 + 交叉编码器重排 + FastAPI SSE"
readme = "README.md"
requires-python = ">=3.10,<4.0"

# 版本号均为 2026-10 实测的最新稳定版。只依赖真正用到的包：
# 代码里没有用 langchain 元包 / langchain-milvus / langchain-huggingface，
# 因此不装它们。
dependencies = [
    # ---- Web 服务 ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",

    # ---- LangChain：只用到消息/文档数据结构、文本切分与 Ollama 集成 ----
    "langchain-core>=1.6.10",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.3",

    # ---- 重排(交叉编码器) ----
    "sentence-transformers==6.1.0",

    # ---- Milvus SDK（直接用 MilvusClient，不经 langchain-milvus）----
    "pymilvus>=3.0.0,<4.0.0",

    # ---- PDF 解析 ----
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[project.scripts]
# 安装后可直接执行 `RAG-app` 启动服务
rag-app = "rag_app.main:main"
# 命令行工具：入库 / 检索 / 查看概况
rag-app-cli = "rag_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
# 110 而不是常见的 100：ruff 的行宽按**显示宽度**计算，一个中文字符占 2 列。
# 本项目的注释与文档字符串都是中文，用 100 会让正常的中文说明频繁超限。
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E701：本文件作者偏好紧凑的单行写法（`if x: continue`、`try: stmt`），
# 该规则会与之持续冲突。只影响排版，不影响正确性，故关闭。
ignore = ["E701"]
