[build-system]
# 采用 setuptools + src layout：包位于 src/ 下，避免测试时误导入工作区根目录
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "RAG-app"
version = "0.1.0"
description = "本地 RAG 系统：Milvus 混合检索(BM25+稠密) + RRF 融合 + 交叉编码器重排 + FastAPI SSE"
readme = "README.md"
requires-python = ">=3.10,<4.0"

# 版本号均为 2026-10 实测的最新稳定版
dependencies = [
    # ---- Web 服务 ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",

    # ---- LangChain 1.x 模块化依赖 ----
    "langchain==1.4.5",
    "langchain-ollama==1.1.0",
    "langchain-milvus==0.4.0",
    "langchain-text-splitters==1.1.3",
    "langchain-huggingface==1.2.3",

    # ---- 重排(交叉编码器) ----
    "sentence-transformers==6.1.0",

    # ---- 向量库 SDK(由 langchain-milvus 间接引入，这里显式锁定避免漂移) ----
    "pymilvus>=3.0.0,<4.0.0",

    # ---- 文档解析 ----
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]
# RAGAS 评估：可选依赖，不装也能跑全部核心功能。
# 装法：pip install -e ".[eval]"
# 版本上限刻意收在 <0.5 —— RAGAS 在 0.2/0.3/0.4 之间改过多次 API，
# 上限能避免将来升级到不兼容的大版本却毫无察觉。
eval = [
    "ragas>=0.2,<0.5",
]

[project.scripts]
# 安装后可直接执行 `RAG-app` 启动服务
rag-app = "rag_app.main:main"
# 命令行工具：入库 / 检索 / 查看概况
rag-app-cli = "rag_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 默认跳过需要真实模型/真实 Milvus 的集成测试，保证单元测试离线可跑
addopts = "-q -m 'not integration'"
markers = [
    "integration: 需要真实 Milvus / 真实重排模型的测试(默认跳过)",
]
asyncio_mode = "auto"

pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
